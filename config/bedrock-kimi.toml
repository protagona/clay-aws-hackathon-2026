# Live mode on Amazon Bedrock (us-west-2). Needs AWS credentials with bedrock:InvokeModel and
# bedrock:InvokeModelWithResponseStream, and model access plus non-zero quotas for the models below
# (Sonnet/Haiku 5.5 had a 0 tokens/minute quota in the sandbox account on 2026-10-30; see design ADR-8).

[task]
id = "adb"

[model]                      # the agent's model
provider = "bedrock"
id = "us.moonshotai.kimi-k3"
region = "us-west-2"
# no temperature: Kimi K3 on Bedrock rejects it ("This model doesn't support the temperature field")

[judge]                      # GLM 5, not Kimi: the agent here is Kimi K3 and must not grade itself
provider = "bedrock"
id = "zai.glm-5"
region = "us-west-2"
max_tokens = 2048
timeout_s = 120
retries = 2

[summarizer]
provider = "bedrock"
id = "us.amazon.nova-2-lite-v1:0"
region = "us-west-2"
max_tokens = 2048
timeout_s = 120
retries = 2

[limits]
max_model_calls = 12          # live: output room for the final plan within the $2 bound
max_input_tokens = 200000
max_seconds = 300
max_tokens = 4096            # 1024 was too small for the final plan (L1, 2026-10-30)
model_timeout_s = 120
model_retries = 2
mcp_start_timeout_s = 60

[mcp.servers.roda]
command = "uvx"
args = ["awslabs.roda-mcp-server@0.1.7"]
package = "awslabs.roda-mcp-server"
version = "0.1.7"
error_detection = "json_status"

[tracing]
tracers = ["jsonl"]

[storage]
s3_uri = ""                  # set to "s3://<RunsBucket>" after cdk deploy to mirror runs

[scoring]
workflow_weight = 0.5
output_weight = 0.5

[prices]                     # USD per million tokens: Anthropic first-party prices + 10% Bedrock geo/regional premium
                             # (platform.claude.com/docs/en/about-claude/pricing, 2026-10-29). Verify in the console.
"us.anthropic.claude-sonnet-4-6"              = { input = 3.30, output = 16.50 }
"us.anthropic.claude-haiku-4-5-20251001-v1:0" = { input = 1.10, output = 5.50 }
# Nova 2 Lite's price couldn't be read from the Bedrock pricing page; Sonnet 4.6's price is used as a
# conservative UPPER BOUND so evaluation cost is never null. Replace with the console price.
"us.amazon.nova-2-lite-v1:0"                  = { input = 3.30, output = 16.50 }
