# Live mode on Amazon Bedrock (us-west-2). Needs AWS credentials with bedrock:InvokeModel and
# bedrock:InvokeModelWithResponseStream, and model access plus non-zero quotas for the models below
# (Sonnet/Haiku 5.5 had a 0 tokens/minute quota in the sandbox account on 2026-10-30; see design ADR-8).

[task]
id = "adb"

[model]                      # the agent's model: Kimi K3. Cheaper per token than Opus and caches automatically,
                             # so it takes the token-heavy role (design ADR-11). No temperature: Kimi K3 rejects it.
provider = "bedrock"
id = "us.moonshotai.kimi-k3"
region = "us-west-2"

[judge]                      # Opus 4.6: pricier per token, so it takes the light role (~3k in / ~2k out per run);
                             # the sharpest judge in the calibration, and not the agent's vendor
provider = "bedrock"
id = "us.anthropic.claude-opus-4-6-v1"
region = "us-west-2"
max_tokens = 2048
timeout_s = 120
retries = 2

[summarizer]
provider = "bedrock"
id = "us.amazon.nova-2-lite-v1:0"
region = "us-west-2"
max_tokens = 2048
timeout_s = 120
retries = 2

[limits]
max_model_calls = 12          # live: output room for the final plan within the $2 bound
max_input_tokens = 200000
max_seconds = 300
max_tokens = 4096            # 1024 was too small for the final plan (L1, 2026-10-30)
model_timeout_s = 120
model_retries = 2
mcp_start_timeout_s = 60

[mcp.servers.roda]
command = "uvx"
args = ["awslabs.roda-mcp-server@0.1.7"]
package = "awslabs.roda-mcp-server"
version = "0.1.7"
error_detection = "json_status"

[mcp.servers.stac]           # scenes (STAC items) for an area and dates; complements RODA's dataset discovery
command = "{python}"         # this interpreter: the server ships in this repo (src/foundry/engine/mcp_servers/stac.py)
args = ["-m", "foundry.engine.mcp_servers.stac"]
package = "foundry.mcp_servers.stac"
version = "0.1.0"
error_detection = "mcp"
env = { STAC_API_URL = "https://earth-search.aws.element84.com/v1" }   # Earth Search: public, no credentials

[mcp.servers.embeddings]     # Clay v1.5 embeddings (LGND, Sentinel-2, 1280 m): coverage, similar places, change
command = "{python}"         # in this repo (src/foundry/engine/mcp_servers/embeddings.py); DuckDB over public S3
args = ["-m", "foundry.engine.mcp_servers.embeddings"]
package = "foundry.mcp_servers.embeddings"
version = "0.1.0"
error_detection = "mcp"

[embedder]                   # text embeddings for the caption task's retrieval scorer (requirement-gaps ADR-4)
provider = "bedrock"
id = "amazon.titan-embed-text-v2:0"   # on demand in us-west-2; dimensions 256, 512 or 1024 (tested 2026-11-03)
region = "us-west-2"
dimensions = 1024

[tracing]
tracers = ["jsonl"]

[storage]
s3_uri = "s3://foundry-runs-{account}-us-west-2"  # optional: make laptop-stack creates it in your account; "" turns mirroring off

[checks]                     # path check: NAIP is Requester Pays, so these get a signed list billed to this account
requester_pays = ["naip-analytic", "naip-visualization", "naip-source"]   # ($0.000005 per list; at most 25 per run)

[scoring]
workflow_weight = 0.5
output_weight = 0.5

[prices]                     # USD per 1M tokens, us-west-2 on-demand, us. geo profile, standard tier.
                             # Source: AWS Price List API (pricing get-products, AmazonBedrock and
                             # AmazonBedrockFoundationModels), queried 2026-10-30.
"us.anthropic.claude-sonnet-4-6"              = { input = 3.30, output = 16.50, cache_read = 0.33 }
"us.anthropic.claude-haiku-4-5-20251001-v1:0" = { input = 1.10, output = 5.50, cache_read = 0.11 }
"us.anthropic.claude-opus-4-6-v1"             = { input = 5.50, output = 27.50, cache_read = 0.55 }
"us.moonshotai.kimi-k3"                       = { input = 3.30, output = 16.50, cache_read = 0.33 }
"us.amazon.nova-2-lite-v1:0"                  = { input = 0.33, output = 2.75, cache_read = 0.083 }
"zai.glm-5"                                   = { input = 1.00, output = 3.20 }
"amazon.titan-embed-text-v2:0"                = { input = 0.02, output = 0.0 }   # USW2-TitanEmbeddingV2-Text-input-tokens, $0.00002/1K, Price List API 2026-11-03
