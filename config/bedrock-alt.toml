# Live mode on Amazon Bedrock (us-west-2). Needs AWS credentials with bedrock:InvokeModel and
# bedrock:InvokeModelWithResponseStream, and model access enabled for the models below.

[task]
id = "adb"

[model]                      # the agent's model
provider = "bedrock"
id = "us.anthropic.claude-haiku-5-5"
region = "us-west-2"
temperature = 0.2

[judge]                      # a different vendor from the agent, so the agent never grades itself
provider = "bedrock"
id = "us.amazon.nova-2-lite-v1:0"
region = "us-west-2"
max_tokens = 2048
timeout_s = 120
retries = 2

[summarizer]
provider = "bedrock"
id = "us.amazon.nova-2-lite-v1:0"
region = "us-west-2"
max_tokens = 2048
timeout_s = 120
retries = 2

[limits]
max_model_calls = 20
max_input_tokens = 600000
max_seconds = 300
max_tokens = 1024
model_timeout_s = 120
model_retries = 2
mcp_start_timeout_s = 60

[mcp.servers.roda]
command = "uvx"
args = ["awslabs.roda-mcp-server@0.1.7"]
package = "awslabs.roda-mcp-server"
version = "0.1.7"
error_detection = "json_status"

[tracing]
tracers = ["jsonl"]

[storage]
s3_uri = ""                  # set to "s3://<RunsBucket>" after cdk deploy to mirror runs

[scoring]
workflow_weight = 0.5
output_weight = 0.5

[prices]                     # USD per million tokens. Unverified against the Bedrock console (see design ADR-7);
                             # Nova 2 Lite's price is unknown, so evaluation cost_usd is null until it's added.
"us.anthropic.claude-sonnet-5-5" = { input = 2.20, output = 11.00 }
"us.anthropic.claude-haiku-5-5"  = { input = 0.11, output = 0.55 }
