<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if refresh %}<meta http-equiv="refresh" content="3">{% endif %}
{% if noscript_refresh %}<noscript><meta http-equiv="refresh" content="3"></noscript>{% endif %}
{% block script %}{% endblock %}
<title>{% block title %}Foundry Eval Sandbox{% endblock %}</title>
<style>
:root { --bg:#f7f7f5; --fg:#1c1c1a; --muted:#6b6b66; --card:#ffffff; --line:#e2e2dc; --accent:#2f5d8a;
        --ok:#2e7d4f; --bad:#b3412f; --warn:#9a6a00; --banner:#fdecea; --tool:#2a8a80; --track:#e9e9e3;
        --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --other:#8a8a84; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#161615; --fg:#ececea; --muted:#a3a39c; --card:#1f1f1d; --line:#33332f; --accent:#86b1dd;
          --ok:#6cc08f; --bad:#e58a78; --warn:#e0b85c; --banner:#3a1f1a; --tool:#4fb3a9; --track:#2a2a27;
          --s1:#3987e5; --s2:#d95926; --s3:#199e70; --other:#7a7a74; }
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1040px; margin: 0 auto; padding: 20px 16px 48px; }
a { color: var(--accent); }
header.top { display:flex; flex-wrap:wrap; gap:12px 20px; align-items:center; justify-content:space-between; margin-bottom:20px; }
h1 { font-size: 20px; margin: 0; }
form.start { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
label { font-size: 13px; color: var(--muted); }
select { max-width: 100%; }
select, button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
button { background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; }
button:disabled { opacity: .5; cursor: not-allowed; }
button.link { background: none; border: none; color: var(--accent); padding: 0; text-decoration: underline; }
.banner { background: var(--banner); border: 1px solid var(--bad); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px;
          display:flex; gap:12px; justify-content:space-between; align-items:center; flex-wrap:wrap; }
.grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; text-decoration:none; color: inherit; display:block; }
a.card:hover, a.card:focus-visible { border-color: var(--accent); outline: none; }
.card .prompt { font-weight: 600; }
.card .model, .card .when, .card .footer { color: var(--muted); font-size: 13px; }
.card .headline { font-size: 30px; font-weight: 600; margin: 6px 0 0; font-variant-numeric: tabular-nums; }
.card .headline.word { font-size: 18px; color: var(--muted); }
.card .sub { font-size: 13px; font-variant-numeric: tabular-nums; }
.status-succeeded { color: var(--ok); } .status-failed, .status-timeout { color: var(--bad); } .status-running { color: var(--warn); }
.empty { color: var(--muted); padding: 24px 0; }
.empty code { background: var(--card); border: 1px solid var(--line); padding: 2px 6px; border-radius: 4px; }
.runhead { border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 16px; }
.runhead .scores { font-size: 18px; font-variant-numeric: tabular-nums; margin-top: 6px; }
.note { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--warn); padding: 8px 12px; border-radius: 6px; margin: 12px 0; }
table { border-collapse: collapse; width: 100%; font-size: 14px; display:block; overflow-x:auto; }
th, td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
.report h1 { font-size: 20px; } .report h2 { font-size: 17px; margin-top: 24px; }
.wrap { overflow-wrap: anywhere; }
nav.tabs { display:flex; gap:18px; border-bottom:1px solid var(--line); margin-bottom:18px; }
nav.tabs a { padding:8px 2px; text-decoration:none; color:var(--muted); border-bottom:2px solid transparent; }
nav.tabs a[aria-current="page"] { color:var(--fg); border-bottom-color:var(--accent); font-weight:600; }
.panel { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:18px; }
.panel h2 { font-size:16px; margin:0 0 10px; }
.field { margin:0 0 12px; }
.field > .label { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
.checks { display:flex; flex-wrap:wrap; gap:6px 14px; }
.checks label { color:var(--fg); font-size:14px; }
.inline { display:flex; flex-wrap:wrap; gap:14px; align-items:end; }
input[type=number], input[type=text], input[type=file] { font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
input[type=number] { width:90px; }
.muted { color:var(--muted); font-size:13px; }
.ok { color:var(--ok); } .bad { color:var(--bad); }
code { background:var(--bg); border:1px solid var(--line); padding:1px 5px; border-radius:4px; }
/* run monitor (increment 5) */
.monitor { margin-top: 14px; }
.statusbar { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-bottom:14px; }
.pill { display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:1px 8px; border-radius:999px; border:1px solid currentColor; white-space:nowrap; }
.pill.ok { color:var(--ok); } .pill.bad { color:var(--bad); } .pill.warn { color:var(--warn); }
.pill.big { font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; padding:3px 12px; }
.status-evaluating { color:var(--accent); }
.dot { width:8px; height:8px; border-radius:50%; background:currentColor; }
.clock { font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; }
.rings { display:flex; flex-wrap:wrap; gap:18px; margin-bottom:16px; }
.ring { --size:96px; width:var(--size); height:var(--size); border-radius:50%; display:grid; place-content:center; text-align:center;
        background: radial-gradient(closest-side, var(--card) 78%, transparent 79%), conic-gradient(var(--accent) calc(var(--p) * 1%), var(--track) 0);
        animation: fadein .6s ease-out; }
.ring.none { background: radial-gradient(closest-side, var(--card) 78%, transparent 79%), var(--track); }
.ring-num { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.1; }
.ring-label { font-size:12px; color:var(--muted); }
.gauges { display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:12px 20px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
.gauge-head { display:flex; justify-content:space-between; gap:8px; font-size:13px; margin-bottom:5px; }
.num { font-variant-numeric:tabular-nums; }
.bar { height:10px; border-radius:5px; background:var(--track); overflow:hidden; }
.fill { display:block; height:100%; border-radius:5px; background:var(--ok); transition: width .6s ease; }
.fill.warn { background:var(--warn); } .fill.bad { background:var(--bad); }
.stats { grid-column: 1 / -1; display:flex; flex-wrap:wrap; gap:6px 22px; font-size:14px; border-top:1px solid var(--line); padding-top:10px; }
h2.section { font-size:16px; margin:22px 0 8px; }
.waterfall { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; overflow-x:auto; }
.wf-row, .wf-axis { display:grid; grid-template-columns: minmax(130px, 32%) 1fr; gap:10px; align-items:center; min-width:520px; }
.wf-row { font-size:13px; padding:2px 0; border-radius:4px; }
.wf-row:hover { background:var(--bg); }
.wf-label { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.wf-track { position:relative; height:14px; }
.wf-axis .wf-track { height:18px; border-bottom:1px solid var(--line); margin-bottom:4px; }
.tick { position:absolute; top:0; font-size:11px; color:var(--muted); transform:translateX(-50%); }
.tick:first-child { transform:none; }
.wf-bar { position:absolute; top:2px; height:10px; border-radius:3px; background:var(--accent); transform-origin:left; }
.wf-row.new .wf-bar { animation: grow .5s ease-out; }
.wf-bar.tool { background:var(--tool); }
.wf-bar.error { background:var(--bad); }
.wf-bar.working { background: repeating-linear-gradient(45deg, var(--accent) 0 6px, transparent 6px 12px); opacity:.6; animation: stripes 1s linear infinite; background-size: 17px 17px; }
@keyframes grow { from { transform:scaleX(0); } to { transform:scaleX(1); } }
@keyframes stripes { from { background-position:0 0; } to { background-position:17px 0; } }
@keyframes fadein { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:none; } }
.legend { display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; font-size:12px; margin-top:8px; }
.key { display:inline-block; width:14px; height:8px; border-radius:2px; background:var(--accent); }
.key.tool { background:var(--tool); } .key.error { background:var(--bad); }
.step-no { display:inline-block; min-width:22px; color:var(--muted); font-variant-numeric:tabular-nums; font-size:12px; }
.feed { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
.feed-item { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:8px; padding:8px 12px; }
.feed-item.tool { border-left-color:var(--tool); } .feed-item.note { border-left-color:var(--muted); }
.feed-item.error { border-left-color:var(--bad); }
.feed-item.new { animation: fadein .5s ease-out; }
.feed-head { display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; font-size:14px; }
.feed-text { margin-top:4px; font-size:14px; white-space:pre-wrap; }
.feed-md { margin-top:4px; font-size:14px; max-height:320px; overflow:auto; }
.feed-md > :first-child { margin-top:0; } .feed-md > :last-child { margin-bottom:0; }
.feed-md h1, .feed-md h2, .feed-md h3, .feed-md h4 { font-size:15px; margin:10px 0 4px; }
.feed-md p, .feed-md ul, .feed-md ol { margin:4px 0; } .feed-md table { font-size:13px; margin:6px 0; }
.feed-md pre { white-space:pre; }
.feed-error { margin-top:4px; font-size:13px; color:var(--bad); }
.feed details { margin-top:4px; font-size:13px; } .feed summary { cursor:pointer; color:var(--accent); }
.feed pre { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; max-height:240px; overflow:auto; white-space:pre-wrap; font-size:12px; margin:6px 0 0; }
.all-steps { margin-top:24px; } .all-steps > summary { cursor:pointer; font-weight:600; margin-bottom:8px; }
/* dashboard (increment 6) */
.kpis { display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:12px; margin-bottom:18px; }
.kpi { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; }
.kpi-num { font-size:30px; font-weight:650; font-variant-numeric:tabular-nums; line-height:1.15; }
.panel h3 { font-size:14px; margin:0 0 8px; }
.panel details { margin-top:10px; } .panel summary { cursor:pointer; color:var(--accent); font-size:13px; }
.panel details table { margin-top:6px; }
.lb { display:flex; flex-direction:column; gap:2px; overflow-x:auto; }
.lb-row { display:grid; grid-template-columns: minmax(150px, 1.6fr) 90px minmax(160px, 2fr) 80px 80px; gap:10px; align-items:center; padding:5px 0; border-bottom:1px solid var(--line); min-width:600px; font-size:14px; }
.lb-head { font-size:12px; border-bottom-width:2px; }
.lb-score { display:flex; align-items:center; gap:8px; }
.lb-track { position:relative; flex:1; height:12px; background:var(--track); border-radius:4px; }
.lb-fill { position:absolute; left:0; top:0; bottom:0; background:var(--accent); border-radius:4px; }
.lb-whisker { position:absolute; top:50%; height:0; border-top:2px solid var(--fg); }
.lb-whisker::before, .lb-whisker::after { content:""; position:absolute; top:-6px; height:10px; border-left:2px solid var(--fg); }
.lb-whisker::before { left:-1px; } .lb-whisker::after { right:-1px; }
.legend-item { display:inline-flex; align-items:center; gap:5px; margin-right:14px; font-size:13px; }
.scatter-box { overflow-x:auto; margin-top:6px; }
svg.scatter { width:100%; min-width:600px; height:auto; display:block; }
svg.scatter .sv-grid { stroke:var(--line); stroke-width:1; }
svg.scatter .sv-axis { stroke:var(--muted); stroke-width:1; }
svg.scatter .sv-tick { fill:var(--muted); font-size:12px; }
.mark { stroke:var(--card); stroke-width:2; }
.mark.s1 { fill:var(--s1); } .mark.s2 { fill:var(--s2); } .mark.s3 { fill:var(--s3); } .mark.other { fill:var(--other); }
.hit { fill:transparent; }
.dot:hover .mark, a:focus-visible .mark { stroke:var(--fg); }
.struggles { display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap:18px; }
.ranked { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
.ranked li { display:grid; grid-template-columns: 1fr 70px auto; gap:8px; align-items:center; font-size:13px; }
.rk-bar { height:8px; background:var(--track); border-radius:4px; overflow:hidden; }
.rk-fill { display:block; height:100%; background:var(--accent); border-radius:4px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body><main>
<nav class="tabs" aria-label="Sections">
  <a href="/"{% if nav == "runs" %} aria-current="page"{% endif %}>Runs</a>
  <a href="/batches"{% if nav == "batches" %} aria-current="page"{% endif %}>Batches</a>
  <a href="/import"{% if nav == "import" %} aria-current="page"{% endif %}>Import</a>
  <a href="/dashboard"{% if nav == "dashboard" %} aria-current="page"{% endif %}>Dashboard</a>
</nav>
{% block body %}{% endblock %}</main></body>
</html>
