{# One scatter mark: shape, series, x, y. Shapes carry identity alongside colour. #}{% if shape == "circle" %}<circle class="mark {{ series }}" cx="{{ x }}" cy="{{ y }}" r="5"/>{% elif shape == "square" %}<rect class="mark {{ series }}" x="{{ x - 4.5 }}" y="{{ y - 4.5 }}" width="9" height="9" rx="1.5"/>{% elif shape == "triangle" %}<polygon class="mark {{ series }}" points="{{ x }},{{ y - 6 }} {{ x + 5.5 }},{{ y + 4 }} {{ x - 5.5 }},{{ y + 4 }}"/>{% else %}<polygon class="mark {{ series }}" points="{{ x }},{{ y - 6 }} {{ x + 6 }},{{ y }} {{ x }},{{ y + 6 }} {{ x - 6 }},{{ y }}"/>{% endif %}
